name: FlashAttention CUDA compatibility UT

on:
  workflow_call:
    inputs:
      branch:
        description: 'FA branch to clone (v2.7.2 / v2.7.4 / v2.8.2 / v2.8.2_v0.2.0_release). The plain version is derived from it.'
        required: true
        type: string
      matrix:
        description: Board matrix as a JSON array
        required: false
        type: string
        default: '["ZW-810E", "ZW-M890P"]'
  workflow_dispatch:
    inputs:
      branch:
        description: 'FA branch to clone (v2.7.2 / v2.7.4 / v2.8.2 / v2.8.2_v0.2.0_release).'
        required: true
        type: string
        default: 'v2.8.2'
      matrix:
        description: Board matrix as a JSON array
        required: false
        type: string
        default: '["ZW-810E", "ZW-M890P"]'

permissions:
  contents: read

# ci-ppu.yaml calls this workflow once per FA version inside a single run, so the
# group must include the version or the three calls cancel each other.
concurrency:
  group: cudafy-flash-attention-${{ inputs.branch }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SAIL_IMAGE: pkg.flytiger-eco.com/docker_release/pytorch:sdk2.2.0-2.13.0-ubuntu24.04-cuda13.0-py312-eic-20261010

jobs:
  build-test:
    # The caller job name (FA 2.7.2 / FA 2.7.4 / FA 2.8.2) already carries the
    # version, so keep only the matrix dimensions here for short check names.
    name: ${{ matrix.variant }} (${{ matrix.runner }})
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 420
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJson(inputs.matrix || '["ZW-810E", "ZW-M890P"]') }}
        # Only fa2.8.2 converts and tests fa3 in addition to fa2; other versions run fa2 only.
        variant: ${{ fromJson(contains(inputs.branch, '2.8.2') && '["fa2", "fa3"]' || '["fa2"]') }}
    # Job-level group isolates the variant x runner matrix legs (workflow-level
    # concurrency cannot reference matrix). The version must be kept here too:
    # the fa2 legs of the 2.7.2/2.7.4/2.8.2 calls live in the same caller run and
    # would share a group otherwise.
    concurrency:
      group: cudafy-flash-attention-${{ inputs.branch }}-${{ matrix.variant }}-${{ matrix.runner }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout cudafy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Convert, build and test FlashAttention
        id: ppu-test
        uses: flytiger-eco/shared-workflows/cluster-task@main
        with:
          image: ${{ env.SAIL_IMAGE }}
          container_options: |
            cpus: '${{ contains(inputs.branch, '2.7.4') && '40' || '30' }}'
            memory: '240g'
          nnodes: 0
          nproc_per_node: 1
          node_selector: board-type=${{ matrix.runner }}
          namespace: ppu-sched
          timeout_minutes: ${{ contains(inputs.branch, '2.7.2') && 300 || (contains(inputs.branch, '2.7.4') && 360 || 420) }}
          command: |
            set -ex
            unset PIP_INDEX_URL
            # Drop any URL rewrites the image baked into the global git config:
            # they redirect github.com to the unreachable internal gerrit mirror.
            for key in $(git config --global --name-only --get-regexp '^url\.'); do
              git config --global --unset-all "$key"
            done
            git config --global --add safe.directory '*'

            CUDAFY_ROOT=/workspace/source
            TARGET_ROOT=/workspace/target
            CI_SCRIPTS=/workspace/ci-scripts
            # Extract the plain version (2.8.2) from the branch name
            # (v2.8.2 / v2.8.2_v0.2.0_release): drop a leading 'v' and any '_' suffix.
            BRANCH='${{ inputs.branch }}'
            FA_VERSION="${BRANCH#v}"
            FA_VERSION="${FA_VERSION%%_*}"
            FA_BRANCH="$BRANCH"
            VARIANT='${{ matrix.variant }}'
            VARIANT_UPPER="${VARIANT^^}"
            git clone --recurse-submodules -b "$FA_BRANCH" \
              https://github.com/t-head/flash-attention-for-sail.git "$TARGET_ROOT"
            # The target repo ships its own UT runner and casecmd.json
            # caselist; copy them out BEFORE the conversion (cudafy rewrites
            # .py contents in place).
            cp -a "$TARGET_ROOT/.github/workflows/scripts" "$CI_SCRIPTS"
            # Shared summary/env-info helpers are maintained in this repository.
            cp -a "$CUDAFY_ROOT/.github/workflows/scripts/display-test-summary.py" \
                  "$CUDAFY_ROOT/.github/workflows/scripts/generate-env-info.py" \
              "$CI_SCRIPTS/"

            # The repo-level conversion also converts the bundled actlize copy
            # (csrc/actlize) together with the tree: 2.7.2 embeds actlize 0.8.0,
            # 2.7.4/2.8.2 embed actlize 1.0.0.
            python3 "$CUDAFY_ROOT/cudafy.py" flash-attention \
              --version="$FA_VERSION" "$TARGET_ROOT"
            cd "$TARGET_ROOT"

            source /usr/local/PPU_SDK/envsetup.sh || true
            pip uninstall -y flash-attn flash-attn-3 || true
            export MAX_JOBS=20
            export PYTORCH_SAIL_ARCH='ppu_10;ppu_15'
            export FLASH_ATTENTION_FORCE_BUILD=TRUE
            pip install 'setuptools==75.8.0' 'packaging==24.2' psutil ninja

            if [[ "$VARIANT" == fa3 ]]; then
              BUILD_DIR="$TARGET_ROOT/hopper"
            else
              BUILD_DIR="$TARGET_ROOT"
            fi
            LOG_FILE="$BUILD_DIR/build_${VARIANT}.log"
            ERROR_LOG="$BUILD_DIR/error_${VARIANT}.log"
            cd "$BUILD_DIR"
            python ./setup.py bdist_wheel > "$LOG_FILE" 2> "$ERROR_LOG" &
            BUILD_PID=$!
            set +x
            ELAPSED=0
            while kill -0 "$BUILD_PID" 2>/dev/null; do
              sleep 10
              ELAPSED=$((ELAPSED + 10))
              if (( ELAPSED % 600 == 0 )); then
                echo "[$(date '+%F %T')] ${VARIANT_UPPER} build is still running ($((ELAPSED / 60)) min)"
                tail -n 100 "$LOG_FILE" || true
              fi
            done
            set -x
            BUILD_EXIT_CODE=0
            wait "$BUILD_PID" || BUILD_EXIT_CODE=$?
            if [[ "$BUILD_EXIT_CODE" -ne 0 ]]; then
              cat "$ERROR_LOG"
              tail -n 1000 "$LOG_FILE"
              exit "$BUILD_EXIT_CODE"
            fi
            tail -n 200 "$LOG_FILE"

            rm -rf "$BUILD_DIR"/*.egg-info
            pip install "$BUILD_DIR"/dist/*.whl
            if [[ "$VARIANT" == fa3 ]]; then
              pip show -f flash-attn-3 || true
              export PYTHONPATH="$TARGET_ROOT/hopper${PYTHONPATH:+:$PYTHONPATH}"
              (cd /tmp && python -c 'import torch, flash_attn_3._C; print(flash_attn_3._C.__file__)')
            else
              pip show -f flash-attn || true
            fi

            pip install numpy==1.26.4 junit-xml einops
            pip install --upgrade pytest
            RESULT_FILE="test-results-${VARIANT}.xml"
            set +e
            cd "$TARGET_ROOT"
            # Newer FA branches ship casecmd.json (suite-keyed, requires --suite);
            # the fa2.8.2 branch still ships per-variant .list files. Pick whichever
            # exists on the cloned branch.
            if [[ -f "$CI_SCRIPTS/casecmd.json" ]]; then
              python "$CI_SCRIPTS/pr-run-fa-ut.py" \
                --caselist "$CI_SCRIPTS/casecmd.json" --suite "$VARIANT" \
                --output "$RESULT_FILE"
            else
              python "$CI_SCRIPTS/pr-run-fa-ut.py" \
                --caselist "$CI_SCRIPTS/${VARIANT}_pytest.list" \
                --output "$RESULT_FILE"
            fi
            TEST_EXIT_CODE=$?
            python3 "$CI_SCRIPTS/generate-env-info.py" \
              --docker-image '${{ env.SAIL_IMAGE }}' \
              --output env_info.json
            NAS_RESULT_DIR="/mnt/wl_nas/devops/cudafy-ci/flash-attention/${FA_VERSION}/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.runner }}/${VARIANT}"
            mkdir -p "$NAS_RESULT_DIR"
            cp "$RESULT_FILE" "$NAS_RESULT_DIR/" 2>/dev/null || true
            cp env_info.json "$NAS_RESULT_DIR/" 2>/dev/null || true
            cp "$CI_SCRIPTS/display-test-summary.py" "$NAS_RESULT_DIR/"
            exit "$TEST_EXIT_CODE"
          cleanup_policy: on_success

      - name: Test summary
        if: always()
        shell: bash
        run: |
          VARIANT='${{ matrix.variant }}'
          # Same version extraction as the test command above, so the runner-side
          # path matches the directory the Pod wrote (plain version, no v/_ suffix).
          BRANCH='${{ inputs.branch }}'
          FA_VERSION="${BRANCH#v}"
          FA_VERSION="${FA_VERSION%%_*}"
          NAS_RESULT_DIR="/wl_nas/devops/cudafy-ci/flash-attention/${FA_VERSION}/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.runner }}/${VARIANT}"
          XML_FILE="$NAS_RESULT_DIR/test-results-${VARIANT}.xml"
          ENV_FILE="$NAS_RESULT_DIR/env_info.json"
          echo "## FA ${{ inputs.branch }} ${{ matrix.variant }} results (${{ matrix.runner }})" >> "$GITHUB_STEP_SUMMARY"
          if [[ ! -f "$XML_FILE" ]]; then
            echo "JUnit report not found: $XML_FILE" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 "$NAS_RESULT_DIR/display-test-summary.py" \
            "$XML_FILE" --env-info "$ENV_FILE"
