name: Release SGLang CUDA compatibility wheels

# 复用正式发布模板；调用仓库需配置 TEMPLATE_TOKEN、RELEASE_USERNAME、
# RELEASE_TOKEN 和 DATA_TOKEN。源码始终来自 sglang-for-sail 仓库。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'sglang-for-sail 的源码分支，与运行此 workflow 的 cudafy 分支独立'
        required: true
        type: string
        default: main
      package_name:
        description: 'sglang 包的发布名称'
        required: true
        type: string
        default: sglang
      framework:
        description: '依赖框架名称'
        required: true
        type: string
        default: torch
      python_versions:
        description: 'Python 版本 JSON 数组，例如 ["312"]'
        required: true
        type: string
        default: '["312"]'
      os_versions:
        description: '系统版本 JSON 数组，例如 ["ubuntu2404"]'
        required: true
        type: string
        default: '["ubuntu2404"]'
      runtime_versions:
        description: 'CUDA runtime 版本 JSON 数组'
        required: true
        type: string
        default: '["13.0.0"]'
      torch_versions:
        description: 'Torch 版本 JSON 数组'
        required: true
        type: string
        default: '["2.13.0"]'
      sdk_versions:
        description: 'CUDA 兼容 SDK 版本 JSON 数组'
        required: true
        type: string
        default: '["2.2.0"]'
      tag_version:
        description: 'sglang 发布版本；普通分支运行时留空仅保存 wheel artifact'
        required: false
        type: string
      kernel_tag_version:
        description: 'kernel 发布版本；留空时跟随 sglang 发布开关，从 pyproject_sail.toml 读取版本'
        required: false
        type: string

permissions:
  contents: read

# 不同源码分支的发布互不取消。
concurrency:
  group: cudafy-sglang-release-${{ inputs.branch }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve source and sglang-kernel version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      version: ${{ steps.resolve.outputs.version }}
      tag_version: ${{ steps.resolve.outputs.tag_version }}
    steps:
      - name: Clone selected sglang-for-sail branch
        shell: bash
        env:
          SOURCE_BRANCH: ${{ inputs.branch || 'main' }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$SOURCE_BRANCH"
          git clone --branch "$SOURCE_BRANCH" --single-branch https://github.com/t-head/sglang-for-sail.git sglang-source

      - name: Pin source commit and resolve kernel version
        id: resolve
        shell: bash
        working-directory: sglang-source
        env:
          SOURCE_BRANCH: ${{ inputs.branch || 'main' }}
          KERNEL_TAG_VERSION: ${{ inputs.kernel_tag_version || '' }}
          SGLANG_TAG_VERSION: ${{ inputs.tag_version || '' }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$SOURCE_BRANCH"
          commit=$(git rev-parse HEAD)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' python/sglang/kernels/aot/pyproject_sail.toml | head -1)
          if [ -z "$version" ]; then
            echo '::error::无法从 python/sglang/kernels/aot/pyproject_sail.toml 读取 version' >&2
            exit 1
          fi
          # 与参考发布流程保持一致：显式 kernel 版本优先，否则跟随 sglang 的发布开关。
          if [ -n "$KERNEL_TAG_VERSION" ]; then
            tag_version="$KERNEL_TAG_VERSION"
          elif [ "$REF_TYPE" = 'tag' ] || [ -n "$SGLANG_TAG_VERSION" ]; then
            tag_version="$version"
          else
            tag_version=''
          fi
          {
            echo "commit=$commit"
            echo "version=$version"
            echo "tag_version=$tag_version"
          } >> "$GITHUB_OUTPUT"
          printf 'sglang-for-sail: %s -> %s\nsglang-kernel: %s (release as: %s)\n' \
            "$SOURCE_BRANCH" "$commit" "$version" "${tag_version:-<artifact only>}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build sglang
    needs: resolve
    uses: flytiger-eco/shared-workflows/.github/workflows/matrix-release.yml@main
    permissions:
      contents: write
    secrets:
      template_token: ${{ secrets.TEMPLATE_TOKEN }}
      release_username: ${{ secrets.RELEASE_USERNAME }}
      release_token: ${{ secrets.RELEASE_TOKEN }}
      data_token: ${{ secrets.DATA_TOKEN }}
    with:
      package_name: ${{ inputs.package_name || 'sglang' }}
      framework: ${{ inputs.framework || 'torch' }}
      template_repository: flytiger-eco/shared-workflows
      template_ref: main
      python_versions: ${{ inputs.python_versions || '["312"]' }}
      os_versions: ${{ inputs.os_versions || '["ubuntu2404"]' }}
      runtime_versions: ${{ inputs.runtime_versions || '["13.0.0"]' }}
      torch_versions: ${{ inputs.torch_versions || '["2.13.0"]' }}
      sdk_versions: ${{ inputs.sdk_versions || '["2.2.0"]' }}
      tag_version: ${{ inputs.tag_version || '' }}
      # 模板检出的是 cudafy 仓库；源码放在其子目录中，方便模板收集 wheel。
      # 只增加源码拉取和定位，后面的 sglang 构建步骤保持参考 workflow 原样。
      build_command: |
        set -eo pipefail
        CUDAFY_ROOT="$(pwd)"
        TARGET_ROOT="$CUDAFY_ROOT/sglang-source"
        TARGET_COMMIT='${{ needs.resolve.outputs.commit }}'
        git clone --no-checkout https://github.com/t-head/sglang-for-sail.git "$TARGET_ROOT"
        git -C "$TARGET_ROOT" fetch --no-tags origin "$TARGET_COMMIT"
        git -C "$TARGET_ROOT" checkout --detach "$TARGET_COMMIT"
        git -C "$TARGET_ROOT" submodule update --init --recursive
        cd "$TARGET_ROOT"

        unset PIP_INDEX_URL
        export HOME=$(eval echo ~$(id -un))
        source /usr/local/PPU_SDK/envsetup.sh || true
        source scripts/ci/utils/install_protoc.sh
        source scripts/ci/utils/install_rustup.sh
        cd python
        cp pyproject_other.toml pyproject.toml
        cp ../README.md ../LICENSE .
        pip install build wheel setuptools setuptools-scm setuptools-rust
        git config --global --add safe.directory '*'
        python3 -m build --wheel

  build-kernel:
    name: Convert and build sglang-kernel
    needs: resolve
    uses: flytiger-eco/shared-workflows/.github/workflows/matrix-release.yml@main
    permissions:
      contents: write
    secrets:
      template_token: ${{ secrets.TEMPLATE_TOKEN }}
      release_username: ${{ secrets.RELEASE_USERNAME }}
      release_token: ${{ secrets.RELEASE_TOKEN }}
      data_token: ${{ secrets.DATA_TOKEN }}
    with:
      package_name: sglang-kernel
      framework: ${{ inputs.framework || 'torch' }}
      template_repository: flytiger-eco/shared-workflows
      template_ref: main
      python_versions: ${{ inputs.python_versions || '["312"]' }}
      os_versions: ${{ inputs.os_versions || '["ubuntu2404"]' }}
      runtime_versions: ${{ inputs.runtime_versions || '["13.0.0"]' }}
      torch_versions: ${{ inputs.torch_versions || '["2.13.0"]' }}
      sdk_versions: ${{ inputs.sdk_versions || '["2.2.0"]' }}
      tag_version: ${{ needs.resolve.outputs.tag_version }}
      # 转换脚本来自本次运行检出的 cudafy 仓库，不从外部下载或修改内核源码。
      build_command: |
        set -eo pipefail
        CUDAFY_ROOT="$(pwd)"
        TARGET_ROOT="$CUDAFY_ROOT/sglang-source"
        TARGET_COMMIT='${{ needs.resolve.outputs.commit }}'
        git clone --no-checkout https://github.com/t-head/sglang-for-sail.git "$TARGET_ROOT"
        git -C "$TARGET_ROOT" fetch --no-tags origin "$TARGET_COMMIT"
        git -C "$TARGET_ROOT" checkout --detach "$TARGET_COMMIT"
        git -C "$TARGET_ROOT" submodule update --init --recursive
        cd "$TARGET_ROOT"

        unset PIP_INDEX_URL
        export HOME=$(eval echo ~$(id -un))
        source /usr/local/PPU_SDK/envsetup.sh || true
        export MAX_JOBS="${MAX_JOBS:-$(nproc)}"
        git config --global --add safe.directory '*'
        pip install --no-input wheel setuptools
        cd python/sglang/kernels/aot
        test -f setup_sail.py || { echo '::error::python/sglang/kernels/aot/setup_sail.py is missing' >&2; exit 1; }
        python3 "$CUDAFY_ROOT/cudafy_sail_sglang.py" --file "$TARGET_ROOT/python/sglang/kernels/aot/setup_sail.py"
        python3 -c 'import torch; print(f"torch {torch.__version__} (cuda {torch.version.cuda})")'
        cp pyproject_sail.toml pyproject.toml
        python3 setup_sail.py bdist_wheel
