name: cudafy checkin

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: ci-ppu-cudafy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  precheck:
    name: Pre-check
    uses: flytiger-eco/.github/.github/workflows/user-precheck.yml@main
    secrets: inherit

  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: precheck
    uses: flytiger-eco/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  human-review:
    name: Human Review Gate
    needs: ai-code-review
    uses: flytiger-eco/.github/.github/workflows/human-review.yml@main
    secrets: inherit

  deepgemm-ut-tests:
    name: DeepGEMM
    needs: human-review
    uses: ./.github/workflows/pr-deepgemm-ut.yaml
    secrets: inherit

  flash-attention-ut-272:
    name: FA 2.7.2
    needs: human-review
    uses: ./.github/workflows/pr-fa-ut.yaml
    with:
      branch: 'v2.7.2'
    secrets: inherit

  flash-attention-ut-274:
    name: FA 2.7.4
    needs: human-review
    uses: ./.github/workflows/pr-fa-ut.yaml
    with:
      branch: 'v2.7.4'
    secrets: inherit

  flash-attention-ut-282:
    name: FA 2.8.2
    needs: human-review
    uses: ./.github/workflows/pr-fa-ut.yaml
    with:
      branch: 'v2.8.2'
    secrets: inherit

  flashmla-ut-tests:
    name: FlashMLA
    needs: human-review
    uses: ./.github/workflows/pr-flashmla.yaml
    secrets: inherit

  # Roll-up gate for branch rulesets: require only this single check
  # ("CI passed") instead of enumerating every matrix leg. It fails when any
  # job above failed, was cancelled or was skipped.
  ci-gate:
    name: CI passed
    needs:
      - precheck
      - ai-code-review
      - human-review
      - deepgemm-ut-tests
      - flash-attention-ut-272
      - flash-attention-ut-274
      - flash-attention-ut-282
      - flashmla-ut-tests
    if: always()          # Evaluate the roll-up even when some jobs failed
    runs-on: k8s-runner-group-cpu-flytiger
    # This runner group requires every job to run in a container.
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 10
    steps:
      - name: Fail if any required job did not succeed
        env:
          PRECHECK: ${{ needs.precheck.result }}
          AI_CODE_REVIEW: ${{ needs.ai-code-review.result }}
          HUMAN_REVIEW: ${{ needs.human-review.result }}
          DEEPGEMM: ${{ needs.deepgemm-ut-tests.result }}
          FA_272: ${{ needs.flash-attention-ut-272.result }}
          FA_274: ${{ needs.flash-attention-ut-274.result }}
          FA_282: ${{ needs.flash-attention-ut-282.result }}
          FLASHMLA: ${{ needs.flashmla-ut-tests.result }}
        run: |
          status=0
          for job in PRECHECK AI_CODE_REVIEW HUMAN_REVIEW DEEPGEMM FA_272 FA_274 FA_282 FLASHMLA; do
            # The runner executes this step with plain POSIX sh, which has no
            # bash-style "${!job}" indirect expansion; emulate it with eval.
            eval "result=\${$job}"
            echo "$job: $result"
            # success is the only acceptable result; failure / cancelled /
            # skipped all roll up into a red gate.
            if [ "$result" != "success" ]; then
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::One or more required jobs did not succeed (see results above)."
          fi
          exit "$status"
