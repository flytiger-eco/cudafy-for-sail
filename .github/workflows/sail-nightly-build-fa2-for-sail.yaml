name: sail nightly build flash-attention-for-sail

on:
  schedule:
    # Daily at 12:00 UTC (20:00 Beijing time).
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Name of the package to build and upload'
        required: false
        type: string
        default: flash_attn
      framework:
        description: 'Name of the dependent framework'
        required: false
        type: string
        default: torch
      python_versions:
        description: 'JSON array; allowed values: 38, 310, 312'
        required: false
        type: string
        default: '["312"]'
      os_versions:
        description: 'JSON array; allowed values: ubuntu2004, ubuntu2204, ubuntu2404, alios7u2'
        required: false
        type: string
        default: '["ubuntu2404"]'
      runtime_versions:
        description: 'JSON array; allowed CUDA versions: 12.6.0, 12.8.0, 12.9.0, 13.0.0, 13.2.0'
        required: false
        type: string
        default: '["13.0.0"]'
      torch_versions:
        description: 'JSON array; allowed values: 2.6.0, 2.7.0, 2.8.0, 2.9.0, 2.10.0, 2.11.0, 2.13.0'
        required: false
        type: string
        default: '["2.13.0"]'
      sdk_versions:
        description: 'JSON array; allowed values: 2.1.1, 2.2.0, 2.2.1'
        required: false
        type: string
        default: '["2.2.1"]'
      branch:
        description: 'cudafy repository branch, tag, or full commit SHA; leave empty to use the commit that triggered the workflow'
        required: false
        type: string
        default: ''
      target_ref:
        description: 'flash-attention-for-sail PR URL, branch, release tag, or commit; leave empty to use the latest v2.8.2 branch'
        required: false
        type: string
        default: 'v2.8.2'
      package_version:
        description: 'Artifactory package version and automatic upload directory prefix; does not override the wheel version generated from source'
        required: false
        type: string
        default: '2.8.2'
      package_edition:
        description: 'Artifactory package edition'
        required: false
        type: string
        default: oe
      package_type:
        description: 'Artifactory package type'
        required: false
        type: string
        default: pypi
      runs_on:
        description: 'CPU runner for all jobs; accepts a single label or a JSON array of labels'
        required: false
        type: string
        default: x86-ubuntu2404-64-256
      build_command:
        description: 'Custom Bash build command; leave empty to build FA2 in the source root; only trusted configuration is accepted; FA_COMMIT is the resolved source SHA'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: nightly-build-fa2-${{ inputs.branch || github.ref }}-${{ inputs.target_ref || 'v2.8.2' }}
  cancel-in-progress: true

jobs:
  source:
    name: Resolve FA2 source
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on || 'x86-ubuntu2404-64-256' }}
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      source_properties: ${{ steps.source.outputs.source_properties }}
    steps:
      - name: Resolve FlashAttention target
        id: target
        shell: bash
        env:
          # Pass raw input through the environment instead of interpolating it into Bash.
          TARGET_REF_INPUT: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          raw="${TARGET_REF_INPUT//[[:space:]]/}"
          raw="${raw%%[?#]*}"
          ref=refs/heads/v2.8.2
          if [[ -n "$raw" ]]; then
            if [[ "$raw" =~ ^https://github\.com/t-head/flash-attention-for-sail/pull/([0-9]+)(/.*)?$ ]]; then
              ref="refs/pull/${BASH_REMATCH[1]}/head"
            elif [[ "$raw" =~ ^[A-Za-z0-9][A-Za-z0-9._/@:+-]*$ ]] && [[ "$raw" != *'/pull/'* ]]; then
              if [[ "$raw" =~ ^[0-9]+$ ]] && [[ ${#raw} -ne 40 ]]; then
                echo '::error::Bare PR numbers are not supported; use a flash-attention-for-sail PR URL, branch, tag, or commit'
                exit 1
              fi
              ref="$raw"
            else
              echo '::error::target_ref must be a flash-attention-for-sail PR URL, branch, tag, or commit'
              exit 1
            fi
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout FlashAttention source
        uses: actions/checkout@v4
        with:
          repository: t-head/flash-attention-for-sail
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record FA2 source properties
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f setup.py || ! -f flash_attn/__init__.py ]]; then
            echo '::error::The selected source does not contain the FA2 root package'
            exit 1
          fi
          commit="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          # Detached PR/tag/commit checkouts have no branch; leave the branch property empty.
          branch="$(git symbolic-ref --quiet --short HEAD || true)"
          tag="$(git tag --points-at HEAD | paste -sd ',' -)"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          export FA_SOURCE_BRANCH="$branch"
          export FA_SOURCE_COMMIT="$commit"
          export FA_SOURCE_TAG="$tag"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          properties = {
              key: os.environ[f"FA_SOURCE_{key.upper()}"]
              for key in ("branch", "commit", "tag")
          }
          print("source_properties=" + json.dumps(properties, separators=(",", ":")))
          PY
          printf 'FA2 branch: %s\nFA2 commit: %s\nFA2 tag: %s\n' \
            "$branch" "$commit" "$tag" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and upload FA2 wheel
    needs: source
    uses: flytiger-eco/shared-workflows/.github/workflows/nightly-build.yml@main
    secrets:
      template_token: ${{ secrets.TEMPLATE_TOKEN }}
      release_username: ${{ secrets.RELEASE_USERNAME }}
      release_token: ${{ secrets.RELEASE_TOKEN }}
    with:
      # Scheduled and push runs have no inputs; use the same defaults as manual runs.
      package_name: ${{ inputs.package_name || 'flash_attn' }}
      framework: ${{ inputs.framework || 'torch' }}
      template_repository: flytiger-eco/shared-workflows
      template_ref: main
      upload_repository: flytiger-eco/flash-attention-for-sail
      source_properties: ${{ needs.source.outputs.source_properties }}
      runs_on: ${{ inputs.runs_on || 'x86-ubuntu2404-64-256' }}
      python_versions: ${{ inputs.python_versions || '["312"]' }}
      os_versions: ${{ inputs.os_versions || '["ubuntu2404"]' }}
      runtime_versions: ${{ inputs.runtime_versions || '["13.0.0"]' }}
      torch_versions: ${{ inputs.torch_versions || '["2.13.0"]' }}
      sdk_versions: ${{ inputs.sdk_versions || '["2.2.1"]' }}
      branch: ${{ inputs.branch || '' }}
      package_version: ${{ inputs.package_version || '2.8.2' }}
      package_edition: ${{ inputs.package_edition || 'oe' }}
      package_type: ${{ inputs.package_type || 'pypi' }}
      build_command: |
        export FA_COMMIT='${{ needs.source.outputs.commit }}'
        ${{ inputs.build_command || 'set -ex
        unset PIP_INDEX_URL
        CUDAFY_ROOT="$PWD"
        TARGET_ROOT="$CUDAFY_ROOT/flash-attention-source"
        git clone https://github.com/t-head/flash-attention-for-sail.git "$TARGET_ROOT"
        cd "$TARGET_ROOT"
        if ! git cat-file -e "${FA_COMMIT}^{commit}"; then
          git fetch --no-tags origin "$FA_COMMIT"
        fi
        git checkout --detach "$FA_COMMIT"
        git submodule sync --recursive
        git submodule update --init --recursive

        # Convert the entire source tree, including bundled csrc/actlize.
        python3 "$CUDAFY_ROOT/cudafy.py" flash-attention "$TARGET_ROOT"
        source /usr/local/PPU_SDK/envsetup.sh || true
        pip uninstall -y flash-attn flash-attn-3 || true
        export MAX_JOBS=20
        export PYTORCH_SAIL_ARCH="ppu_10;ppu_15"
        export FLASH_ATTENTION_FORCE_BUILD=TRUE
        pip install setuptools==75.8.0 packaging==24.2 psutil ninja wheel

        BUILD_DIR="$TARGET_ROOT"
        cd "$BUILD_DIR"
        python ./setup.py bdist_wheel
        ls -lh ./dist/*.whl' }}
