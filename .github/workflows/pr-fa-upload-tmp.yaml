name: FlashAttention CUDAFY temporary wheel upload

# Convert with cudafy, build the wheel, publish it to a temporary directory.
# Build only: pr-fa-ut.yaml owns the FA UT pipeline. source selects what to
# build (PR URL / branch / release tag / commit id; empty = default branch
# head); variants lists fa2 (root package) and fa3 (hopper/). The version
# label is read from the source tree, so label, NAS path and code always match.
# Artifact names use a ref slug because upload-artifact rejects '/'.
# A schedule run builds every SCHEDULE_TARGETS entry (ref:fa2,fa3), one leg
# per variant; a pinned fa3 is dropped where hopper/ is missing, an explicit
# dispatch for it still fails. Each leg records its source; commit/branch/tag
# are published only when all legs agree.
# Schedules only run from the default branch, so this file must be on main.
# Requires RELEASE_USERNAME / RELEASE_TOKEN (TEMPLATE_TOKEN for private templates).
on:
  schedule:
    - cron: '0 13 * * *'  # Daily at 21:00 Asia/Shanghai (UTC+8)
  workflow_call:
    inputs:
      source:
        description: 'flash-attention-for-sail PR URL / branch / release tag / commit id. Empty builds the head of the default branch.'
        required: false
        type: string
        default: ''
      variants:
        description: 'Variants to build as a JSON array: fa2 (root package) and/or fa3 (hopper package).'
        required: false
        type: string
        default: '["fa2", "fa3"]'
      sail_image:
        description: 'Container image for the build pod. Empty uses the default image pinned in env.'
        required: false
        type: string
        default: ''
      fast:
        description: 'Compile only. This workflow already runs no test suite, so the flag only keeps the input set uniform.'
        required: false
        type: boolean
        default: false
      matrix:
        description: Board matrix as a JSON array
        required: false
        type: string
        default: '["ZW-M890P"]'
    secrets:
      RELEASE_USERNAME:
        required: true
      RELEASE_TOKEN:
        required: true
      TEMPLATE_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      source:
        description: 'flash-attention-for-sail PR URL / branch / release tag / commit id. Empty builds the head of the default branch.'
        required: false
        type: string
      variants:
        description: 'Variants to build as a JSON array: fa2 (root package) and/or fa3 (hopper package).'
        required: false
        type: string
        default: '["fa2", "fa3"]'
      sail_image:
        description: 'Container image for the build pod. Empty uses the default image pinned in env.'
        required: false
        type: string
        default: ''
      fast:
        description: 'Compile only. This workflow already runs no test suite, so the flag only keeps the input set uniform.'
        required: false
        type: boolean
        default: false
      matrix:
        description: Board matrix as a JSON array
        required: false
        type: string
        default: '["ZW-M890P"]'

permissions:
  contents: read

# A schedule run must not cancel a manual verification run, and vice versa.
concurrency:
  group: cudafy-flash-attention-upload-tmp-${{ github.event_name }}-${{ inputs.source || 'pinned' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Empty sail_image falls back to this pinned image.
  SAIL_IMAGE: ${{ inputs.sail_image || 'pkg.flytiger-eco.com/docker_release/pytorch:sdk2.2.1-2.13.0-ubuntu24.04-cuda13.0-py312-20261103' }}
  # Clone base; its head is the default target.
  FA_BRANCH: v2.8.2
  # Schedule events carry no inputs; ref:fa2,fa3 pins each target's
  # variants and every entry becomes its own matrix leg.
  SCHEDULE_TARGETS: v2.8.2:fa2,fa3 v2.7.4:fa2 v2.7.2:fa2

jobs:
  resolve:
    name: Resolve targets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # Matrix legs: [{"ref","kind","slug","commit","version","variant"}, ...]
      legs: ${{ steps.target.outputs.legs }}
    steps:
      - name: Fetch targets and read the FA versions
        id: target
        shell: bash
        env:
          # Passed through env so the raw input never lands in the script text.
          SOURCE_INPUT: ${{ inputs.source }}
          # Restated for schedule runs: the declared default renders empty there.
          VARIANTS_INPUT: ${{ inputs.variants || '["fa2", "fa3"]' }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_TARGETS_VALUE: ${{ env.SCHEDULE_TARGETS }}
        run: |
          set -euo pipefail
          # Dispatch/call carry inputs; a schedule expands to its pinned list.
          sources="$SOURCE_INPUT"
          if [[ "$EVENT_NAME" == schedule ]]; then
            sources="$SCHEDULE_TARGETS_VALUE"
          fi
          # An empty source means the head of the default branch.
          read -r -a targets <<< "${sources:- }"
          [[ ${#targets[@]} -gt 0 ]] || targets=("")

          # Requested variants, e.g. ["fa2", "fa3"], as a bash array.
          requested_variants=()
          while IFS= read -r variant; do
            requested_variants+=("$variant")
          done < <(printf '%s' "$VARIANTS_INPUT" | grep -o '"[A-Za-z0-9._-]*"' | tr -d '"')
          if [[ ${#requested_variants[@]} -eq 0 ]]; then
            echo "::error::Cannot read variants from '$VARIANTS_INPUT'"
            exit 1
          fi

          # One shallow clone of the default branch also registers the remote, so
          # every selected ref is fetched from 'origin' without repeating the address.
          work="$RUNNER_TEMP/fa-resolve"
          rm -rf "$work"
          git clone -q --no-checkout --depth 1 --no-tags -b "$FA_BRANCH" https://github.com/t-head/flash-attention-for-sail.git "$work"
          cd "$work"

          legs='[]'
          summary=''
          for source in "${targets[@]}"; do
            # Accepted forms: PR URL / branch / release tag / commit id; bare PR
            # numbers are ambiguous.
            raw="${source//[[:space:]]/}"
            # A schedule entry may pin its own variants (ref:fa2,fa3); every
            # other event builds the requested variants.
            source_variants=("${requested_variants[@]}")
            if [[ "$EVENT_NAME" == schedule && "$raw" == *:* ]]; then
              variant_spec="${raw##*:}"
              if [[ "$variant_spec" =~ ^fa[23](,fa[23])*$ ]]; then
                raw="${raw%:*}"
                IFS=',' read -r -a source_variants <<< "$variant_spec"
              fi
            fi
            kind=default
            ref="$FA_BRANCH"
            if [[ -n "$raw" ]]; then
              raw="${raw%%[?#]*}"
              # Whitelist check: the value is reused as a git ref below.
              if [[ ! "$raw" =~ ^[A-Za-z0-9][A-Za-z0-9._/@:+-]*$ ]]; then
                echo "::error::Unsupported source '$source': expected a PR URL, branch, release tag or commit id"
                exit 1
              fi
              case "$raw" in
                *'/pull/'*)
                  num="${raw#*/pull/}"
                  num="${num%%[!0-9]*}"
                  [[ "$num" =~ ^[0-9]+$ ]] || { echo "::error::Cannot read a PR number from '$raw'"; exit 1; }
                  kind=pr
                  ref="$num"
                  ;;
                *)
                  if [[ "$raw" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    # Release tag such as 2.8.2+v2.1.0: never a branch or a commit id.
                    kind=tag
                    ref="$raw"
                  elif [[ "$raw" =~ ^[0-9]+$ ]] && [[ ${#raw} -ne 40 ]]; then
                    echo "::error::Bare PR numbers are not supported: pass the PR URL, a branch, a release tag or a commit id (got '$raw')"
                    exit 1
                  else
                    # Branch or commit id: the fetch below decides which one.
                    kind=ref
                    ref="$raw"
                  fi
                  ;;
              esac
            fi

            # Artifact names forbid '/', so a ref such as release/v2.8.2_v1.0.0 is
            # slugged for the artifact name. NAS paths keep the raw ref, where
            # subdirectories are harmless.
            slug="$(printf '%s' "$ref" | tr -c 'A-Za-z0-9._+-' '-')"

            # Shallow fetch of the one commit to build: its tree is enough to read
            # the version and to check whether the requested variants exist.
            case "$kind" in
              pr)
                git fetch -q --no-tags --depth 1 origin "+refs/pull/${ref}/head" || {
                  echo "::error::Cannot fetch PR #$ref from FA repository"
                  exit 1
                }
                ;;
              default) git fetch -q --no-tags --depth 1 origin "refs/heads/${ref}" ;;
              tag)
                git fetch -q --no-tags --depth 1 origin "refs/tags/${ref}" || {
                  echo "::error::Tag '$ref' not found in FA repository"
                  exit 1
                }
                ;;
              *)
                git fetch -q --no-tags --depth 1 origin "refs/heads/${ref}" \
                  || git fetch -q --no-tags --depth 1 origin "$ref" || {
                    echo "::error::Cannot fetch '$ref': no branch or tag with that name and it is not a fetchable commit (use the full 40-char sha)"
                    exit 1
                  }
                ;;
            esac
            commit="$(git rev-parse "FETCH_HEAD^{commit}")"

            # setup.py takes the version from flash_attn/__init__.py, e.g. 2.7.4.post1.
            raw_version="$(git show "${commit}:flash_attn/__init__.py" 2>/dev/null \
              | sed -n 's/^__version__[[:space:]]*=[[:space:]]*//p' | head -n 1 | tr -d "\"'")"
            version="${raw_version%%.post*}"
            version="${version%%+*}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::$commit is not a readable flash-attention tree (__version__='$raw_version')"
              exit 1
            fi

            # v2.7.2 ships no hopper/ tree. A schedule must still cover the other
            # targets, so a pinned fa3 is dropped there; an explicit request
            # fails fast here instead of after a long build.
            target_variants=()
            skip_note=''
            for variant in "${source_variants[@]}"; do
              if [[ "$variant" == fa3 ]] && ! git cat-file -e "${commit}:hopper/setup.py" 2>/dev/null; then
                if [[ "$EVENT_NAME" == schedule ]]; then
                  echo "::notice::$ref (version $version) has no hopper/setup.py: skipping fa3 on this run"
                  skip_note='fa3 skipped, no hopper/'
                  continue
                fi
                echo "::error::fa3 requested but $commit has no hopper/setup.py"
                exit 1
              fi
              target_variants+=("$variant")
            done
            if [[ ${#target_variants[@]} -eq 0 ]]; then
              echo "::error::No buildable variant for $ref (requested ${source_variants[*]})"
              exit 1
            fi

            for variant in "${target_variants[@]}"; do
              leg="{\"ref\":\"$ref\",\"kind\":\"$kind\",\"slug\":\"$slug\",\"commit\":\"$commit\",\"version\":\"$version\",\"variant\":\"$variant\"}"
              if [[ "$legs" == '[]' ]]; then
                legs="[$leg]"
              else
                legs="${legs%]},$leg]"
              fi
              summary+="- ${ref} -> ${commit:0:8} (version ${version}, ${variant})"$'\n'
            done
            if [[ -n "$skip_note" ]]; then
              summary+="- ${ref} -> ${commit:0:8} (version ${version}): ${skip_note}"$'\n'
            fi
          done

          {
            echo "legs<<EOF"
            echo "$legs"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          printf 'FlashAttention targets:\n%s' "$summary" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.leg.variant }} ${{ matrix.leg.ref }} (${{ matrix.runner }})
    needs: resolve
    runs-on: k8s-runner-group-cpu-flytiger
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # The fallbacks only apply to schedule runs, which carry no inputs;
        # dispatch and workflow_call always send their declared defaults.
        runner: ${{ fromJson(inputs.matrix || '["ZW-M890P"]') }}
        # One leg per (target ref, variant); resolve already dropped unavailable
        # variants such as fa3 on v2.7.2.
        leg: ${{ fromJson(needs.resolve.outputs.legs) }}
    # Cancel per leg; the workflow-level group cannot distinguish targets or
    # matrix legs.
    concurrency:
      group: cudafy-flash-attention-upload-tmp-${{ matrix.leg.ref }}-${{ matrix.leg.variant }}-${{ matrix.runner }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout cudafy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Convert and build FlashAttention
        id: ppu-build
        uses: flytiger-eco/shared-workflows/cluster-task@main
        with:
          image: ${{ env.SAIL_IMAGE }}
          container_options: |
            cpus: '30'
            memory: '240g'
          nnodes: 0
          nproc_per_node: 1
          node_selector: board-type=${{ matrix.runner }}
          namespace: ppu-sched
          timeout_minutes: 360
          command: |
            set -ex
            unset PIP_INDEX_URL
            # Drop the image's url rewrites: they point github.com at an unreachable gerrit mirror.
            for key in $(git config --global --name-only --get-regexp '^url\.'); do
              git config --global --unset-all "$key"
            done
            git config --global --add safe.directory '*'

            CUDAFY_ROOT=/workspace/source
            TARGET_ROOT=/workspace/target
            FA_VERSION='${{ matrix.leg.version }}'
            TARGET_KIND='${{ matrix.leg.kind }}'
            TARGET_REF='${{ matrix.leg.ref }}'
            TARGET_COMMIT='${{ matrix.leg.commit }}'
            VARIANT='${{ matrix.leg.variant }}'
            VARIANT_UPPER="${VARIANT^^}"
            git clone --recurse-submodules -b '${{ env.FA_BRANCH }}' https://github.com/t-head/flash-attention-for-sail.git "$TARGET_ROOT"
            # The clone above is the default target; anything else is fetched and
            # checked out here, before the conversion runs.
            if [[ "$(git -C "$TARGET_ROOT" rev-parse HEAD)" != "$TARGET_COMMIT" ]]; then
              cd "$TARGET_ROOT"
              if [[ "$TARGET_KIND" == pr ]]; then
                git fetch --no-tags origin \
                  "+refs/pull/${TARGET_REF}/head:refs/remotes/origin/pr/${TARGET_REF}"
              elif [[ "$TARGET_KIND" == tag ]]; then
                git fetch --no-tags origin "+refs/tags/${TARGET_REF}:refs/tags/${TARGET_REF}"
              else
                git fetch --no-tags origin "$TARGET_COMMIT"
              fi
              git checkout --detach "$TARGET_COMMIT"
              # Submodules must follow the checked-out tree.
              git submodule sync --recursive
              git submodule update --init --recursive
            fi
            echo "FlashAttention target: ${TARGET_KIND} ${TARGET_REF} -> ${TARGET_COMMIT} (version ${FA_VERSION})"

            # Each leg records the source it built; the merge job only publishes
            # commit/branch/tag when every leg agrees.
            SOURCE_COMMIT="$(git -C "$TARGET_ROOT" rev-parse HEAD)"
            [[ "$SOURCE_COMMIT" == "$TARGET_COMMIT" ]]
            SOURCE_BRANCH=''
            if [[ "$TARGET_KIND" == default ]]; then
              SOURCE_BRANCH="$TARGET_REF"
            elif [[ "$TARGET_KIND" == ref ]] && [[ "$(git -C "$TARGET_ROOT" rev-parse --verify --quiet "refs/remotes/origin/${TARGET_REF}^{commit}" || true)" == "$SOURCE_COMMIT" ]]; then
              SOURCE_BRANCH="$TARGET_REF"
            fi
            SOURCE_METADATA_DIR="/mnt/wl_nas/devops/cudafy-ci/flash-attention/${{ matrix.leg.ref }}/${FA_VERSION}/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.runner }}/${VARIANT}"
            mkdir -p "$SOURCE_METADATA_DIR"
            {
              printf 'repo=t-head/flash-attention-for-sail\n'
              printf 'commit=%s\n' "$SOURCE_COMMIT"
              printf 'branch=%s\n' "$SOURCE_BRANCH"
              printf 'tag=%s\n' "$(git -C "$TARGET_ROOT" tag --points-at HEAD | paste -sd ',' -)"
              printf 'extra_info=cudafy=%s@%s;image=%s;build_tool=setup.py\n' \
                '${{ github.repository }}' "$(git -C "$CUDAFY_ROOT" rev-parse HEAD)" "$SAIL_IMAGE"
            } > "$SOURCE_METADATA_DIR/source-metadata.txt"

            # No --version: the engine is version independent and the old flag only
            # accepted 2.7.2/2.7.4/2.8.2. Bundled csrc/actlize is converted too.
            python3 "$CUDAFY_ROOT/cudafy.py" flash-attention "$TARGET_ROOT"
            cd "$TARGET_ROOT"

            source /usr/local/PPU_SDK/envsetup.sh || true
            pip uninstall -y flash-attn flash-attn-3 || true
            export MAX_JOBS=20
            export PYTORCH_SAIL_ARCH='ppu_10;ppu_15'
            export FLASH_ATTENTION_FORCE_BUILD=TRUE
            pip install 'setuptools==75.8.0' 'packaging==24.2' psutil ninja

            if [[ "$VARIANT" == fa3 ]]; then
              BUILD_DIR="$TARGET_ROOT/hopper"
            else
              BUILD_DIR="$TARGET_ROOT"
            fi
            LOG_FILE="$BUILD_DIR/build_${VARIANT}.log"
            ERROR_LOG="$BUILD_DIR/error_${VARIANT}.log"
            cd "$BUILD_DIR"
            python ./setup.py bdist_wheel > "$LOG_FILE" 2> "$ERROR_LOG" &
            BUILD_PID=$!
            set +x
            ELAPSED=0
            while kill -0 "$BUILD_PID" 2>/dev/null; do
              sleep 10
              ELAPSED=$((ELAPSED + 10))
              if (( ELAPSED % 600 == 0 )); then
                echo "[$(date '+%F %T')] ${VARIANT_UPPER} build is still running ($((ELAPSED / 60)) min)"
                tail -n 100 "$LOG_FILE" || true
              fi
            done
            set -x
            BUILD_EXIT_CODE=0
            wait "$BUILD_PID" || BUILD_EXIT_CODE=$?
            if [[ "$BUILD_EXIT_CODE" -ne 0 ]]; then
              cat "$ERROR_LOG"
              tail -n 1000 "$LOG_FILE"
              exit "$BUILD_EXIT_CODE"
            fi
            tail -n 200 "$LOG_FILE"

            NAS_RESULT_DIR="/mnt/wl_nas/devops/cudafy-ci/flash-attention/${{ matrix.leg.ref }}/${FA_VERSION}/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.runner }}/${VARIANT}"
            mkdir -p "$NAS_RESULT_DIR/wheels"
            cp "$BUILD_DIR"/dist/*.whl "$NAS_RESULT_DIR/wheels/"
          cleanup_policy: on_success

      - name: Upload build source metadata (${{ matrix.leg.variant }} / ${{ matrix.leg.ref }})
        # One metadata artifact per leg keeps every ref's provenance; the merge
        # job decides what can be published for the whole batch.
        if: ${{ !cancelled() && matrix.runner == fromJson(inputs.matrix || '["ZW-M890P"]')[0] }}
        uses: actions/upload-artifact@v4
        with:
          name: flash-attention-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.leg.slug }}-${{ matrix.leg.version }}-${{ matrix.leg.variant }}
          path: /wl_nas/devops/cudafy-ci/flash-attention/${{ matrix.leg.ref }}/${{ matrix.leg.version }}/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.runner }}/${{ matrix.leg.variant }}/source-metadata.txt
          if-no-files-found: error
          overwrite: true

      - name: Upload wheel artifact (${{ matrix.leg.variant }} / ${{ matrix.runner }})
        # Wheels are board independent: only the first board uploads, all
        # variants do. !cancelled() keeps artifacts when the build failed.
        if: ${{ !cancelled() && matrix.runner == fromJson(inputs.matrix || '["ZW-M890P"]')[0] }}
        uses: actions/upload-artifact@v4
        with:
          name: flash-attention-wheel-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.leg.slug }}-${{ matrix.leg.version }}-${{ matrix.leg.variant }}
          # Container-side /mnt/wl_nas maps to /wl_nas on the runner host.
          path: /wl_nas/devops/cudafy-ci/flash-attention/${{ matrix.leg.ref }}/${{ matrix.leg.version }}/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.runner }}/${{ matrix.leg.variant }}/wheels/*.whl
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  merge:
    name: Merge wheel artifacts
    # Partial success must still publish: a failed leg (e.g. one board or one
    # target) must not block the wheels the other legs built. 'skipped' means
    # resolve failed, so no leg produced anything.
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.artifact_name }}
      repo: ${{ steps.source.outputs.repo }}
      commit: ${{ steps.source.outputs.commit }}
      branch: ${{ steps.source.outputs.branch }}
      tag: ${{ steps.source.outputs.tag }}
      extra_info: ${{ steps.source.outputs.extra_info }}
    steps:
      - name: Download build source metadata
        uses: actions/download-artifact@v4
        with:
          # One subdirectory per leg; a flat merge would overwrite same-named files.
          pattern: flash-attention-source-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/wheel-source

      - name: Aggregate build source parameters
        id: source
        shell: bash
        env:
          SOURCE_DIR: ${{ runner.temp }}/wheel-source
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$SOURCE_DIR"/*/source-metadata.txt)
          [[ ${#files[@]} -gt 0 ]] || { echo "::error::No source metadata found"; exit 1; }
          # repo is fixed by the build; commit/branch/tag may differ between the
          # refs of a scheduled batch. Publish a property only when every leg
          # reports the same non-empty value, otherwise leave it empty so the
          # template skips that property.
          single() {
            local value
            value="$(sed -n "s/^$1=//p" "${files[@]}" | sort -u)"
            if [[ -n "$value" && "$value" != *$'\n'* ]]; then printf '%s' "$value"; fi
          }
          repo="$(single repo)"
          [[ -n "$repo" ]] || { echo "::error::Source metadata does not agree on repo"; exit 1; }
          {
            printf 'repo=%s\n' "$repo"
            printf 'commit=%s\n' "$(single commit)"
            printf 'branch=%s\n' "$(single branch)"
            printf 'tag=%s\n' "$(single tag)"
            printf 'extra_info=%s\n' "$(single extra_info)"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Build sources'
            echo ''
            echo '| leg | commit | branch | tag |'
            echo '| --- | --- | --- | --- |'
            for f in "${files[@]}"; do
              printf '| %s | %s | %s | %s |\n' \
                "$(basename "$(dirname "$f")")" \
                "$(sed -n 's/^commit=//p' "$f")" \
                "$(sed -n 's/^branch=//p' "$f")" \
                "$(sed -n 's/^tag=//p' "$f")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set merged artifact name
        id: artifact-name
        shell: bash
        run: echo 'artifact_name=flash-attention-wheels-${{ github.run_id }}-${{ github.run_attempt }}' >> "$GITHUB_OUTPUT"

      - name: Merge wheel artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: ${{ steps.artifact-name.outputs.artifact_name }}
          # All targets and variants of this run land in one batch directory.
          pattern: flash-attention-wheel-${{ github.run_id }}-${{ github.run_attempt }}-*
          compression-level: 0
          delete-merged: false

  push:
    name: Call temporary wheel upload template
    needs: merge
    uses: flytiger-eco/shared-workflows/.github/workflows/push-tmp-wheel.yml@main
    with:
      # run_attempt moves when only the publishing job is rerun.
      artifact_name: ${{ needs.merge.outputs.artifact_name }}
      repo: ${{ needs.merge.outputs.repo }}
      commit: ${{ needs.merge.outputs.commit }}
      branch: ${{ needs.merge.outputs.branch }}
      tag: ${{ needs.merge.outputs.tag }}
      extra_info: ${{ needs.merge.outputs.extra_info }}
      template_repository: flytiger-eco/shared-workflows
      template_ref: main
    secrets:
      release_username: ${{ secrets.RELEASE_USERNAME }}
      release_token: ${{ secrets.RELEASE_TOKEN }}
      # Read-only token; also enable cross-repo access in the template repo.
      template_token: ${{ secrets.TEMPLATE_TOKEN }}

  result:
    name: Show batch directory URL
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write to logs and job summary
        shell: bash
        env:
          UPLOAD_URL: ${{ needs.push.outputs.upload_url }}
        run: |
          set -euo pipefail
          printf 'Batch directory: %s\n' "$UPLOAD_URL" | tee -a "$GITHUB_STEP_SUMMARY"
