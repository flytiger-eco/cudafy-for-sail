name: sail nightly build pla

# Convert with cudafy, build the wheel, then publish it to the nightly directory.
# Build only: no tests are run.
# PLA source defaults to the latest master; target_ref selects a PR URL,
# a branch name, a release tag (x.y.z+va.b.c) or a commit id instead.
on:
  push:
    branches:
      - 'fangjie-fj-patch-1'
  schedule:
    # Daily at 12:00 UTC (20:00 Beijing time).
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Name of the package to build and upload'
        required: false
        type: string
        default: pla
      framework:
        description: 'Name of the dependent framework'
        required: false
        type: string
        default: torch
      python_versions:
        description: 'JSON array; allowed values: 38, 310, 312'
        required: false
        type: string
        default: '["312"]'
      os_versions:
        description: 'JSON array; allowed values: ubuntu2004, ubuntu2204, ubuntu2404, alios7u2'
        required: false
        type: string
        default: '["ubuntu2404"]'
      runtime_versions:
        description: 'JSON array; allowed CUDA versions: 12.6.0, 12.8.0, 12.9.0, 13.0.0, 13.2.0'
        required: false
        type: string
        default: '["13.0.0"]'
      torch_versions:
        description: 'JSON array; allowed values: 2.6.0, 2.7.0, 2.8.0, 2.9.0, 2.10.0, 2.11.0, 2.13.0'
        required: false
        type: string
        default: '["2.13.0"]'
      sdk_versions:
        description: 'JSON array; allowed values: 2.1.1, 2.2.0, 2.2.1'
        required: false
        type: string
        default: '["2.2.0"]'
      branch:
        description: 'cudafy repository branch, tag, or full commit SHA; leave empty to use the commit that triggered the workflow'
        required: false
        type: string
        default: ''
      target_ref:
        description: 'pla source branch to clone and build; defaults to master'
        required: false
        type: string
        default: master
      package_version:
        description: 'Artifactory package version and automatic upload directory prefix; does not override the wheel version generated from source'
        required: false
        type: string
        default: 'nightly'
      package_edition:
        description: 'Artifactory package edition'
        required: false
        type: string
        default: oe
      package_type:
        description: 'Artifactory package type'
        required: false
        type: string
        default: pypi
      upload_repository:
        description: 'Artifactory upload path repository in owner/repository format'
        required: false
        type: string
        default: t-head/pla
      runs_on:
        description: 'CPU runner for all jobs; accepts a single label or a JSON array of labels'
        required: false
        type: string
        default: x86-ubuntu2404-8-32
      build_command:
        description: 'Custom Bash build command; leave empty to use the default; only trusted configuration is accepted; BUILD_TARGET_BRANCH is the clone branch'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: nightly-build-pla-${{ inputs.branch || github.ref }}-${{ inputs.build_target_branch || 'master' }}-${{ inputs.target_ref || '' }}
  cancel-in-progress: true

jobs:
  source:
    name: Resolve PLA source
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on || 'x86-ubuntu2404-8-32' }}
    timeout-minutes: 15
    outputs:
      kind: ${{ steps.target.outputs.kind }}
      ref: ${{ steps.target.outputs.ref }}
      checkout_ref: ${{ steps.target.outputs.checkout_ref }}
      commit: ${{ steps.source.outputs.commit }}
      build_target_branch: ${{ steps.target.outputs.build_target_branch }}
      source_properties: ${{ steps.source.outputs.source_properties }}
    steps:
      - name: Resolve PLA target
        id: target
        shell: bash
        env:
          # Passed through env so the raw input never lands in the script text.
          TARGET_REF_INPUT: ${{ inputs.target_ref }}
          BUILD_TARGET_BRANCH_INPUT: ${{ inputs.build_target_branch || 'master' }}
        run: |
          set -euo pipefail
          build_target_branch="$BUILD_TARGET_BRANCH_INPUT"
          if [[ ! "$build_target_branch" =~ ^[A-Za-z0-9][A-Za-z0-9._/@+-]*$ ]] || ! git check-ref-format --branch "$build_target_branch" > /dev/null; then
            echo '::error::build_target_branch must be a valid branch name using letters, digits, dots, underscores, slashes, @, +, or -'
            exit 1
          fi
          # Accepted forms: PR URL / branch name / release tag / commit id. Bare
          # PR numbers are rejected because they read like commit ids.
          raw="${TARGET_REF_INPUT//[[:space:]]/}"
          kind=default
          # PLA's default branch is master, not main.
          ref="$build_target_branch"
          checkout_ref="refs/heads/$build_target_branch"
          if [[ -n "$raw" ]]; then
            # Drop a pasted ?query/#fragment before validating.
            raw="${raw%%[?#]*}"
            # Reject anything that is not a plausible ref (also guards the later
            # interpolation of these outputs into the build command).
            if [[ ! "$raw" =~ ^[A-Za-z0-9][A-Za-z0-9._/@:+-]*$ ]]; then
              echo "::error::Unsupported target_ref '$TARGET_REF_INPUT': expected a PR URL, branch name, release tag or commit id"
              exit 1
            fi
            case "$raw" in
              *'/pull/'*)
                # PR URL: keep only the number, dropping /files and any suffix.
                num="${raw#*/pull/}"
                num="${num%%[!0-9]*}"
                [[ "$num" =~ ^[0-9]+$ ]] || { echo "::error::Cannot read a PR number from '$raw'"; exit 1; }
                kind=pr
                ref="$num"
                checkout_ref="refs/pull/${num}/head"
                ;;
              *)
                if [[ "$raw" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  # Release tag such as 2.8.2+v2.1.0: never a branch or a commit id.
                  kind=tag
                  ref="$raw"
                  checkout_ref="$raw"
                elif [[ "$raw" =~ ^[0-9]+$ ]] && [[ ${#raw} -ne 40 ]]; then
                  echo "::error::Bare PR numbers are not supported: pass the PR URL, a branch name, a release tag or a commit id (got '$raw')"
                  exit 1
                else
                  # Branch name or commit id: decided by git when checking out.
                  kind=ref
                  ref="$raw"
                  checkout_ref="$raw"
                fi
                ;;
            esac
          fi
          case "$kind" in
            default) display="$build_target_branch (latest)" ;;
            pr) display="PR #$ref" ;;
            tag) display="tag $ref" ;;
            *) display="$ref" ;;
          esac
          {
            echo "kind=$kind"
            echo "ref=$ref"
            echo "checkout_ref=$checkout_ref"
            echo "build_target_branch=$build_target_branch"
          } >> "$GITHUB_OUTPUT"
          echo "PLA target: $display" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Checkout PLA source
        uses: actions/checkout@v4
        with:
          repository: t-head/pla
          ref: ${{ steps.target.outputs.checkout_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record PLA source properties
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          # Detached PR/tag/commit checkouts have no branch; do not report the clone branch.
          branch="$(git symbolic-ref --quiet --short HEAD || true)"
          tag="$(git tag --points-at HEAD | paste -sd ',' -)"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          export PLA_SOURCE_BRANCH="$branch"
          export PLA_SOURCE_COMMIT="$commit"
          export PLA_SOURCE_TAG="$tag"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          properties = {
              key: os.environ[f"PLA_SOURCE_{key.upper()}"]
              for key in ("branch", "commit", "tag")
          }
          print("source_properties=" + json.dumps(properties, separators=(",", ":")))
          PY
          printf 'PLA branch: %s\nPLA commit: %s\nPLA tag: %s\n' \
            "$branch" "$commit" "$tag" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and upload PLA wheel
    needs: source
    uses: flytiger-eco/shared-workflows/.github/workflows/nightly-build.yml@main
    secrets:
      template_token: ${{ secrets.TEMPLATE_TOKEN }}
      release_username: ${{ secrets.RELEASE_USERNAME }}
      release_token: ${{ secrets.RELEASE_TOKEN }}
    with:
      # Scheduled and push runs have no inputs; use the same defaults as manual runs.
      package_name: ${{ inputs.package_name || 'pla' }}
      framework: ${{ inputs.framework || 'torch' }}
      template_repository: flytiger-eco/shared-workflows
      template_ref: main
      upload_repository: flytiger-eco/pla
      source_properties: ${{ needs.source.outputs.source_properties }}
      runs_on: ${{ inputs.runs_on || 'x86-ubuntu2404-8-32' }}
      python_versions: ${{ inputs.python_versions || '["312"]' }}
      os_versions: ${{ inputs.os_versions || '["ubuntu2404"]' }}
      runtime_versions: ${{ inputs.runtime_versions || '["13.0.0"]' }}
      torch_versions: ${{ inputs.torch_versions || '["2.13.0"]' }}
      sdk_versions: ${{ inputs.sdk_versions || '["2.2.0"]' }}
      branch: ${{ inputs.branch || '' }}
      package_version: ${{ inputs.package_version || 'nightly' }}
      package_edition: ${{ inputs.package_edition || 'oe' }}
      package_type: ${{ inputs.package_type || 'pypi' }}
      build_command: |
        export BUILD_TARGET_BRANCH='${{ needs.source.outputs.build_target_branch }}'
        export PLA_TARGET_KIND='${{ needs.source.outputs.kind }}'
        export PLA_TARGET_REF='${{ needs.source.outputs.ref }}'
        ${{ inputs.build_command || 'set -ex
        unset PIP_INDEX_URL PYTHONPATH PLA_BUILD_NAMESPACE PPU_ACTLIZE_DIR
        # The image rewrites github.com to an unreachable gerrit mirror.
        for key in $(git config --global --name-only --get-regexp "^url[.]"); do
          git config --global --unset-all "$key"
        done
        git config --global --add safe.directory "*"

        # The template checks out the calling repository here; clone PLA beside it.
        CUDAFY_ROOT="$PWD"
        TARGET_ROOT="$CUDAFY_ROOT/pla-source"
        # --recurse-submodules pulls 3rdparty/actlize: setup.py builds against
        # the pinned submodule and aborts if the headers are missing.
        git clone --recurse-submodules -b "$BUILD_TARGET_BRANCH" https://github.com/t-head/pla.git "$TARGET_ROOT"
        # Default target is the latest clone. Any other target is checked out on
        # top of it, before the conversion runs.
        TARGET_KIND="$PLA_TARGET_KIND"
        TARGET_REF="$PLA_TARGET_REF"
        if [[ "$TARGET_KIND" != default ]]; then
          cd "$TARGET_ROOT"
          if [[ "$TARGET_KIND" == pr ]]; then
            # PR head from any fork, matching what the PR checks build.
            git fetch --no-tags origin \
              "+refs/pull/${TARGET_REF}/head:refs/remotes/origin/pr/${TARGET_REF}"
            TARGET_COMMIT="$(git rev-parse --verify "refs/remotes/origin/pr/${TARGET_REF}^{commit}")"
          elif [[ "$TARGET_KIND" == tag ]]; then
            # Tags come with the clone; fetch the ref explicitly when missing.
            TARGET_COMMIT="$(git rev-parse --verify --quiet "refs/tags/${TARGET_REF}^{commit}")" || {
              git fetch --no-tags origin "refs/tags/${TARGET_REF}:refs/tags/${TARGET_REF}" || {
                echo "::error::Tag ${TARGET_REF} not found in pla repository"
                exit 1
              }
              TARGET_COMMIT="$(git rev-parse --verify "refs/tags/${TARGET_REF}^{commit}")"
            }
          elif git rev-parse --verify --quiet "refs/remotes/origin/${TARGET_REF}^{commit}" > /dev/null; then
            TARGET_COMMIT="$(git rev-parse --verify "refs/remotes/origin/${TARGET_REF}^{commit}")"
          else
            # Not a branch tip: treat it as a commit id, from the clone or fetched directly.
            TARGET_COMMIT="$(git rev-parse --verify --quiet "${TARGET_REF}^{commit}")" || {
              git fetch --no-tags origin "$TARGET_REF"
              TARGET_COMMIT="$(git rev-parse --verify "FETCH_HEAD^{commit}")"
            }
          fi
          git checkout --detach "$TARGET_COMMIT"
          # Submodules must follow the checked-out tree, not master.
          git submodule sync --recursive
          git submodule update --init --recursive
          echo "PLA target resolved: ${TARGET_KIND} ${TARGET_REF} -> ${TARGET_COMMIT}"
        fi

        python3 "$CUDAFY_ROOT/cudafy.py" general "$TARGET_ROOT"
        cd "$TARGET_ROOT"

        source /usr/local/PPU_SDK/envsetup.sh
        export PPU_SDK_DIR=/usr/local/PPU_SDK
        "$PPU_SDK_DIR/bin/hgcc" --version
        python -m pip install setuptools==69.5.1 setuptools-scm==9.2.2 \
          packaging==24.2 wheel==0.45.1 pybind11==2.13.6 ninja==1.11.1.4 \
          numpy==1.26.4 pandas==2.2.3 einops==0.8.1
        export TORCH_CUDA_ARCH_LIST="8.0"
        export MAX_JOBS=16
        export NVCC_THREADS=2
        python setup.py bdist_wheel' }}
